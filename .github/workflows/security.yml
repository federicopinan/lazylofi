name: Security audit

# Scans the repo for leaked secrets and known-vulnerable Rust
# dependencies. Runs on every push/PR to master and once a week as
# a safety net (new CVEs get filed against old versions).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly on Sunday at 06:00 UTC.
    - cron: "0 6 * * 0"

permissions:
  contents: read

jobs:
  # Gitleaks scans the full git history (fetch-depth: 0) for patterns
  # that look like API keys, tokens, private keys, etc. Findings show
  # up in the Security tab via the uploaded SARIF report.
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # cargo-audit checks every Rust dependency against the RustSec
  # advisory database. Catches things like unmaintained crates and
  # crates with published security advisories.
  cargo-audit:
    name: Dependency audit (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit
